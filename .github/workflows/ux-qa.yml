name: Validar idiomas e voz
on:
  push:
    branches: [melhorias-idiomas-voz-menu]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check_ui.js
      - run: npm install --no-save playwright-core@1.56.1
      - name: Testar aplicativo no Chrome
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/vb-http.log 2>&1 &
          node tools/smoke_langs.js
          node tools/smoke_pairs.js
