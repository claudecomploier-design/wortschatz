name: Testar gerador offline
on:
  push:
    branches: [offline-30-language-packs]
    paths:
      - tools/generate_offline_pairs.py
      - tools/export_translation_sources.js
      - .github/workflows/offline-generator-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-argos:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline translator
        run: python -m pip install --quiet 'argostranslate>=1.9,<2'
      - name: Generate small French-language base pack
        env:
          ARGOS_DEVICE_TYPE: cpu
          ARGOS_CHUNK_TYPE: MINISBD
        run: python tools/generate_offline_pairs.py --base fr --smoke
      - name: Verify generated packs
        run: |
          ls -lh data/ov/
          node -e "const fs=require('fs');const txt=fs.readFileSync('data/ov/de-fr.js','utf8');if(!txt.includes('VB_OFFLINE')||!txt.includes('h'))process.exit(1);"
