<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3f8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vokabel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Vokabel 1000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: uma coluna tipo ficha; barra de racha e meta no topo; cores de gênero (masc azul, fem vermelho, neutro verde) */
:root{
  --bg:#f3f4f1; --card:#ffffff; --fg:#1c2027; --muted:#646a73; --line:#dcdfe0; --rule:#e9ecef;
  --accent:#2b3f8f; --accent-fg:#ffffff; --flame:#e0661b; --flame-bg:#fdeee2;
  --m:#1f5fbf; --f:#c2303a; --n:#23824a; --m-bg:#e6eefb; --f-bg:#fbe9ea; --n-bg:#e5f3ea;
  --bad:#b8402e; --mid:#a8740f; --good:#23824a;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14161b; --card:#1d2027; --fg:#e8eaee; --muted:#9aa0aa; --line:#323640; --rule:#272a32;
  --accent:#8fa6ff; --accent-fg:#10142a; --flame:#ff9a52; --flame-bg:#3a2516;
  --m:#79a8f2; --f:#f08a8f; --n:#73c792; --m-bg:#1c2a42; --f-bg:#3a1f23; --n-bg:#1b3325;
  --bad:#ec8a78; --mid:#e2b25a; --good:#73c792; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.02em;margin:0;line-height:1}
.langs{display:flex;gap:6px}
.langs button{font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.langs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.streak{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.flame{display:flex;align-items:center;gap:8px;background:var(--flame-bg);color:var(--flame);border-radius:12px;padding:8px 12px}
.flame svg{width:26px;height:26px;flex:none}
.flame b{font-family:var(--display);font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.flame span{display:block;font-size:.72rem;line-height:1.1;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.flame.off{background:var(--rule);color:var(--muted)}
.goal{min-width:0;display:grid;gap:6px}
.goal-top{display:flex;justify-content:space-between;gap:8px;font-size:.85rem}
.goal-top b{font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--flame);border-radius:99px;transition:width .3s}
.week{display:flex;gap:6px;justify-content:space-between}
.day{display:grid;justify-items:center;gap:2px;font-size:.66rem;color:var(--muted);text-transform:uppercase}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.dot.done{background:var(--flame);border-color:var(--flame)}
.dot.done::after{content:"";width:8px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.dot.today{border-color:var(--flame)}
.banner{margin-top:10px;background:var(--flame-bg);color:var(--flame);border-radius:12px;padding:10px 14px;font-weight:700;text-align:center}
nav{display:flex;gap:4px;margin:16px 0 14px;border-bottom:1px solid var(--line)}
nav button{font:inherit;font-weight:700;background:none;border:0;color:var(--muted);padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
select,input[type=search],.seg button{font:inherit;font-size:.9rem;padding:8px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;max-width:100%}
.seg{display:inline-flex}
.seg button{cursor:pointer;border-radius:0}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);background-position:0 66px}
.card-top{display:flex;justify-content:space-between;gap:8px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.prompt{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.15;margin:16px 0 6px;text-wrap:balance;overflow-wrap:anywhere}
.hintline{color:var(--muted);font-size:.9rem;margin:0}
.answer{margin-top:16px;padding-top:14px;border-top:2px dashed var(--line);display:grid;gap:12px}
.word{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.05;overflow-wrap:anywhere}
.g-m{color:var(--m)}.g-f{color:var(--f)}.g-n{color:var(--n)}
.art{font-weight:700;opacity:.9}
.pron{font-family:var(--mono);font-size:.95rem;color:var(--muted)}
.hook{background:var(--bg);border-radius:10px;padding:12px 14px}
.hook .tag{display:inline-block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent);margin-bottom:4px}
.hook p{margin:0}
.ex{display:grid;gap:2px}.ex .d{font-weight:700}.ex .p{color:var(--muted);font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:700;cursor:pointer;border-radius:10px;padding:12px 16px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);width:100%;margin-top:16px}
.btn.small{padding:6px 10px;font-size:.85rem;border-radius:8px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.grade .btn{padding:12px 6px}
.grade .b1{color:var(--bad)}.grade .b2{color:var(--mid)}.grade .b3{color:var(--good)}
.grade small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.done{text-align:center;padding:26px 14px}
.done h2{font-family:var(--display);margin:0 0 6px}
.more{display:grid;gap:8px;margin-top:14px}.more .btn.primary{margin-top:0}
.item{border-top:1px solid var(--line);padding:11px 0;display:grid;gap:4px}
.item-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline}
.item-head .w{font-family:var(--display);font-weight:700;font-size:1.1rem}
.item-head .m{color:var(--muted)}
.item .hk{font-size:.93rem}.item .exs{font-size:.88rem;color:var(--muted)}
.chip{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--bg);color:var(--muted)}
.chip.ok{background:var(--n-bg);color:var(--n)}.chip.fix{background:var(--f-bg);color:var(--f)}
.chip.lv{background:var(--m-bg);color:var(--m)}
textarea{font:inherit;font-size:.9rem;width:100%;min-height:60px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card);color:var(--fg)}
.method{display:grid;gap:16px}
.method section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.method h2{font-family:var(--display);font-size:1.15rem;margin:0 0 8px}
.method p,.method li{max-width:65ch}
.method ol,.method ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td.mono{font-family:var(--mono)}
.gbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.gbox div{border-radius:10px;padding:10px;font-size:.88rem}
.gbox b{display:block;font-family:var(--display);font-size:1.2rem}
.fixbar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.toast{color:var(--good);font-size:.9rem}
.overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.ov{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ov b{display:block;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.ov span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (max-width:420px){.streak{grid-template-columns:1fr}.flame{justify-content:center}}
@media (prefers-reduced-motion:no-preference){.answer{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Vokabel 1000</h1>
    <div class="langs" role="group" aria-label="Língua">
      <button id="lang-de" data-lang="de">Alemão</button>
      <button id="lang-it" data-lang="it">Italiano</button>
      <button id="lang-fr" data-lang="fr">Francês</button>
    </div>
  </header>

  <section class="streak" aria-label="Dias seguidos">
    <div class="flame" id="flame">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2c.6 3.2-1 5-2.5 6.7C8 10.4 6.5 12 6.5 14.6A5.5 5.5 0 0 0 12 20a5.5 5.5 0 0 0 5.5-5.4c0-2.3-1.1-3.9-2.2-5.2-.2 1.4-.9 2.5-2 3 .5-3.6-.3-7.5-1.3-10.4z"/></svg>
      <div><b id="streak-n">0</b><span id="streak-l">dias seguidos</span></div>
    </div>
    <div class="goal">
      <div class="goal-top"><span>Meta de hoje</span><b id="goal-t">0 / 20</b></div>
      <div class="bar"><i id="goal-bar" style="width:0%"></i></div>
      <div class="week" id="week"></div>
    </div>
  </section>
  <div class="banner" id="banner" hidden></div>

  <nav role="tablist">
    <button role="tab" id="tab-train" aria-selected="true">Treinar</button>
    <button role="tab" id="tab-list" aria-selected="false">Palavras</button>
    <button role="tab" id="tab-method" aria-selected="false">Método</button>
  </nav>

  <main id="view-train">
    <div class="overview">
      <div class="ov"><b id="ov-due">0</b><span>para hoje</span></div>
      <div class="ov"><b id="ov-learn">0</b><span>aprendendo</span></div>
      <div class="ov"><b id="ov-known">0</b><span>firmes</span></div>
    </div>
    <div class="controls">
      <select id="sel-level" aria-label="Nível"></select>
      <div class="seg" role="group" aria-label="Direção">
        <button id="dir-pt" aria-pressed="true">PT → <span class="lcode">DE</span></button>
        <button id="dir-tg" aria-pressed="false"><span class="lcode">DE</span> → PT</button>
      </div>
    </div>
    <div id="train"><div class="loading">Carregando palavras...</div></div>
  </main>

  <main id="view-list" hidden>
    <div class="controls">
      <select id="sel-level-list" aria-label="Nível"></select>
      <input type="search" id="search" placeholder="Buscar palavra" aria-label="Buscar palavra">
    </div>
    <p class="hintline" style="margin-bottom:8px">Marque ganchos bons ou ruins. Nos ruins, escreva sua ideia e copie as correções para colar no chat.</p>
    <div id="list"></div>
    <div class="fixbar">
      <span id="fixcount" class="hintline"></span>
      <span class="row"><span id="copied" class="toast" hidden>Copiado. Cole no chat.</span><button class="btn small" id="btn-copy">Copiar correções</button></span>
    </div>
    <textarea id="copy-fallback" hidden readonly aria-label="Correções para copiar"></textarea>
  </main>

  <main id="view-method" hidden><div class="method" id="method"></div></main>
</div>

<script>
const LANGS={
  de:{name:"Alemão",code:"DE",voice:"de-DE",arts:{m:"der",f:"die",n:"das"}},
  it:{name:"Italiano",code:"IT",voice:"it-IT"},
  fr:{name:"Francês",code:"FR",voice:"fr-FR"}
};
const TYPES={EN:"Inglês",PT:"Português",ES:"Espanhol",IT:"Italiano",FR:"Francês",LA:"Latim",CA:"Catalão",DE:"Alemão",SOM:"Som PT",IMG:"Imagem",REGRA:"Regra",FALSO:"Falso amigo",ONO:"Onomatopeia",PAD:"Padrão",FRASE:"Frase famosa"};
const LEVEL=50, GOAL=20, NEW_DEFAULT=10, INTERVALS=[0,1,3,7,16,35], DAY=864e5;
window.VB_DATA=window.VB_DATA||{};

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function dayKey(t){const d=t?new Date(t):new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today0(){const d=new Date();d.setHours(0,0,0,0);return d.getTime()}

/* migração do progresso antigo (só alemão) */
(function(){const old=store.get("ws100-prog",null);if(old&&!store.get("vb-prog-de",null))store.set("vb-prog-de",old)})();

let lang=store.get("vb-lang","de"), dir="pt", level="all", listLevel="1";
let CARDS=[], prog={}, fixes={}, queue=[], cur=null, revealed=false, free=false, extraNew=0;
let act=store.get("vb-activity",{}); // {"AAAA-MM-DD": cartas respondidas}
let best=store.get("vb-best",0);

/* ===== artigo ===== */
function article(w,g){
  if(!g)return "";
  if(lang!=="de"&&/^(les|i|gli|le) /i.test(w))return "";
  if(lang==="de")return LANGS.de.arts[g]||"";
  const v=/^[aeiouàâäéèêëíìîïóòôöúùûüœæh]/i.test(w);
  if(lang==="it"){if(g==="f")return /^[aeiouàéèìòù]/i.test(w)?"l'":"la";if(/^[aeiouàéèìòù]/i.test(w))return "l'";if(/^(s[^aeiou]|z|gn|ps|x|y|pn)/i.test(w))return "lo";return "il"}
  if(lang==="fr"){if(v)return "l'";return g==="f"?"la":"le"}
  return "";
}
function full(c){const a=article(c.w,c.g);if(!a)return c.w;return a.endsWith("'")?a+c.w:a+" "+c.w}
function label(c){const a=article(c.w,c.g);if(!a)return c.g?`<span class="g-${c.g}">${esc(c.w)}</span>`:esc(c.w);const sep=a.endsWith("'")?"":" ";return `<span class="g-${c.g}"><span class="art">${esc(a)}</span>${sep}${esc(c.w)}</span>`}

/* ===== racha ===== */
function streakInfo(){
  let n=0,d=new Date();d.setHours(12);
  if((act[dayKey(d.getTime())]||0)<GOAL)d.setDate(d.getDate()-1);
  while((act[dayKey(d.getTime())]||0)>=GOAL){n++;d.setDate(d.getDate()-1)}
  return n;
}
function renderStreak(){
  const n=streakInfo();if(n>best){best=n;store.set("vb-best",best)}
  const t=act[dayKey()]||0;const doneToday=t>=GOAL;
  $("streak-n").textContent=n;$("streak-l").textContent=n===1?"dia seguido":"dias seguidos";
  $("flame").classList.toggle("off",!doneToday);
  $("goal-t").textContent=`${Math.min(t,GOAL)} / ${GOAL}`+(t>GOAL?`  (+${t-GOAL})`:"");
  $("goal-bar").style.width=Math.min(100,t/GOAL*100)+"%";
  const names=["dom","seg","ter","qua","qui","sex","sáb"];let h="";
  for(let i=6;i>=0;i--){const d=new Date();d.setHours(12);d.setDate(d.getDate()-i);const k=dayKey(d.getTime());
    h+=`<div class="day"><div class="dot ${(act[k]||0)>=GOAL?"done":""} ${i===0?"today":""}"></div>${names[d.getDay()]}</div>`}
  $("week").innerHTML=h;
}
function addActivity(){
  const k=dayKey();const before=act[k]||0;act[k]=before+1;
  const keys=Object.keys(act).sort();while(keys.length>400)delete act[keys.shift()];
  store.set("vb-activity",act);
  if(before<GOAL&&act[k]>=GOAL){const n=streakInfo();
    $("banner").textContent=n>1?`Meta batida! ${n} dias seguidos. Volte amanhã para manter a sequência.`:"Meta batida! Primeiro dia da sequência. Volte amanhã.";
    $("banner").hidden=false;setTimeout(()=>$("banner").hidden=true,6000)}
  renderStreak();
}

/* ===== dados ===== */
function loadLang(l,cb){
  if(VB_DATA[l])return cb();
  const s=document.createElement("script");s.src=`data/${l}.js?v=4`;s.onload=cb;
  s.onerror=()=>{$("train").innerHTML='<div class="card done"><h2>Sem conexão</h2><p class="hintline">Abra uma vez com internet para baixar esta língua. Depois ela funciona offline.</p></div>'};
  document.head.appendChild(s);
}
function setLang(l){
  lang=l;store.set("vb-lang",l);
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  document.querySelectorAll(".lcode").forEach(e=>e.textContent=LANGS[l].code);
  $("train").innerHTML='<div class="loading">Carregando palavras...</div>';
  loadLang(l,()=>{
    CARDS=VB_DATA[l].map((r,i)=>({i,id:r[0],w:r[0],g:r[1],pt:r[2],pron:r[3],tipo:TYPES[r[4]]||r[4],hook:r[5],ex:r[6],exPt:r[7],lv:Math.floor(i/LEVEL)+1}));
    prog=store.get("vb-prog-"+l,{});fixes=store.get("vb-fix-"+l,{});
    const x=store.get("vb-extra-"+l,{d:"",n:0});extraNew=x.d===dayKey()?x.n:0;
    const nl=Math.ceil(CARDS.length/LEVEL);let o=`<option value="all">Todos os níveis, em ordem</option>`,o2="";
    for(let i=1;i<=nl;i++){const a=(i-1)*LEVEL+1,b=Math.min(i*LEVEL,CARDS.length);o+=`<option value="${i}">Nível ${i} (palavras ${a} a ${b})</option>`;o2+=`<option value="${i}">Nível ${i} (${a} a ${b})</option>`}
    $("sel-level").innerHTML=o;$("sel-level-list").innerHTML=o2;level="all";listLevel="1";
    cur=null;free=false;buildQueue();renderTrain();renderMethod();
    if(!$("view-list").hidden)renderList();
  });
}

/* ===== treino ===== */
function newToday(){const t=today0();return Object.values(prog).filter(p=>p.first>=t).length}
function newRoom(){return Math.max(0,NEW_DEFAULT+extraNew-newToday())}
function pool(){return CARDS.filter(c=>level==="all"||c.lv==+level)}
function buildQueue(){
  const now=Date.now(),p=pool();
  const due=p.filter(c=>prog[c.id]&&prog[c.id].due<=now).sort((a,b)=>prog[a.id].due-prog[b.id].due);
  const fresh=p.filter(c=>!prog[c.id]).slice(0,newRoom());
  queue=[...due,...fresh];
}
function overview(){const now=Date.now();let d=0,l=0,k=0;CARDS.forEach(c=>{const p=prog[c.id];if(!p)return;if(p.due<=now)d++;if(p.box>=4)k++;else l++});
  $("ov-due").textContent=d+Math.min(newRoom(),CARDS.filter(c=>!prog[c.id]).length);$("ov-learn").textContent=l;$("ov-known").textContent=k}
function speak(t){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=LANGS[lang].voice;u.rate=.9;
  const v=s.getVoices().find(v=>v.lang&&v.lang.replace("_","-").startsWith(LANGS[lang].voice.slice(0,2)));if(v)u.voice=v;s.speak(u)}catch(e){}}
function renderTrain(){
  const el=$("train");overview();
  if(!CARDS.length){el.innerHTML=`<div class="card done"><h2>${LANGS[lang].name} chegando</h2><p class="hintline">As palavras desta língua estão sendo preparadas e aparecem aqui em breve.</p></div>`;return}
  if(!cur){cur=queue.shift()||null;revealed=false}
  if(!cur){const left=pool().filter(c=>!prog[c.id]).length;const seen=pool().some(c=>prog[c.id]);
    el.innerHTML=`<div class="card done"><h2>${free?"Treino livre feito":"Tudo em dia"}</h2>
      <p class="hintline">${left?`Ainda há ${left} palavras novas ${level==="all"?"em "+LANGS[lang].name.toLowerCase():"neste nível"}.`:"Você já começou todas as palavras deste nível."}</p>
      <div class="more">${left?`<button class="btn primary" id="more10">Liberar mais 10 novas</button>`:""}
      ${seen?`<button class="btn" id="freeplay">Treino livre: repassar o que já vi</button>`:""}</div>
      ${seen?`<p class="hintline" style="margin-top:12px">O treino livre conta para a meta do dia e não mexe nas datas de revisão.</p>`:""}</div>`;
    const m=$("more10");if(m)m.onclick=()=>{extraNew+=10;store.set("vb-extra-"+lang,{d:dayKey(),n:extraNew});free=false;buildQueue();renderTrain()};
    const f=$("freeplay");if(f)f.onclick=()=>{free=true;queue=pool().filter(c=>prog[c.id]).sort(()=>Math.random()-.5);renderTrain()};
    return}
  const isNew=!prog[cur.id];const tg=LANGS[lang].code;
  const front=dir==="pt"?`<div class="prompt">${esc(cur.pt)}</div><p class="hintline">Diga em ${LANGS[lang].name.toLowerCase()}, em voz alta${cur.g?", com o artigo":""}.</p>`
    :`<div class="prompt">${label(cur)}</div><p class="hintline">O que significa?</p>`;
  let back="";
  if(revealed){const box=(prog[cur.id]||{box:0}).box;back=`<div class="answer">
    ${dir==="pt"?`<div class="word">${label(cur)}</div>`:`<div class="prompt" style="margin:0">${esc(cur.pt)}</div>`}
    <div class="row">${cur.pron?`<span class="pron">[${esc(cur.pron)}]</span>`:""}<button class="btn small" id="say-w">Ouvir palavra</button></div>
    ${cur.hook?`<div class="hook"><span class="tag">Gancho · ${esc(cur.tipo)}</span><p>${esc(cur.hook)}</p></div>`:""}
    ${cur.ex?`<div class="ex"><span class="d">${esc(cur.ex)}</span><span class="p">${esc(cur.exPt)}</span></div><div class="row"><button class="btn small" id="say-e">Ouvir frase e repetir</button></div>`:""}
    <div class="grade">
      <button class="btn b1" data-r="0">Errei<small>volta agora</small></button>
      <button class="btn b2" data-r="1">Difícil<small>amanhã</small></button>
      <button class="btn b3" data-r="2">Sabia<small>${free?"treino livre":INTERVALS[Math.min(5,box+1)]+" dia(s)"}</small></button>
    </div></div>`}
  el.innerHTML=`<div class="card"><div class="card-top"><span>Nível ${cur.lv} · ${tg}</span><span>${free?"treino livre":isNew?"nova":"revisão"} · faltam ${queue.length+1}</span></div>${front}${revealed?back:`<button class="btn primary" id="reveal">Mostrar resposta</button>`}</div>`;
  if(!revealed){$("reveal").onclick=()=>{revealed=true;renderTrain();if(dir==="pt")speak(full(cur))}}
  else{$("say-w").onclick=()=>speak(full(cur));const se=$("say-e");if(se)se.onclick=()=>speak(cur.ex);
    el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>grade(+b.dataset.r))}
}
function grade(r){
  addActivity();
  if(free){if(r===0)queue.splice(Math.min(3,queue.length),0,cur);cur=null;renderTrain();return}
  const now=Date.now();const p=prog[cur.id]||{box:0,first:now};
  if(r===0){p.box=0;p.due=now;queue.splice(Math.min(3,queue.length),0,cur)}
  else if(r===1){p.box=Math.max(1,p.box);p.due=today0()+DAY}
  else{p.box=Math.min(5,p.box+1);p.due=today0()+INTERVALS[p.box]*DAY}
  prog[cur.id]=p;store.set("vb-prog-"+lang,prog);cur=null;renderTrain()}

/* ===== lista ===== */
function renderList(){
  const q=$("search").value.trim().toLowerCase();
  const items=q?CARDS.filter(c=>(c.w+" "+c.pt).toLowerCase().includes(q)).slice(0,80):CARDS.filter(c=>c.lv==+listLevel);
  $("list").innerHTML=items.length?items.map(c=>{const f=fixes[c.id]||{};const p=prog[c.id];return `<div class="item">
    <div class="item-head"><span><span class="w">${label(c)}</span> <span class="m">· ${esc(c.pt)}</span></span>
    <span class="row">${p?`<span class="chip lv">${p.box>=4?"firme":"aprendendo"}</span>`:""}${f.s==="ok"?'<span class="chip ok">bom</span>':f.s==="fix"?'<span class="chip fix">corrigir</span>':""}
      <button class="btn small" data-ok="${esc(c.id)}">Bom</button><button class="btn small" data-fix="${esc(c.id)}">Corrigir</button></span></div>
    ${c.hook?`<div class="hk"><span class="chip">${esc(c.tipo)}</span> ${esc(c.hook)}</div>`:""}
    ${c.ex?`<div class="exs">${esc(c.ex)} · ${esc(c.exPt)}</div>`:""}
    ${f.s==="fix"?`<textarea data-note="${esc(c.id)}" placeholder="Sua ideia de gancho ou o que está ruim">${esc(f.n||"")}</textarea>`:""}
  </div>`}).join(""):'<p class="hintline">Nenhuma palavra encontrada.</p>';
  $("list").querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{fixes[b.dataset.ok]={s:"ok"};saveFix();renderList()});
  $("list").querySelectorAll("[data-fix]").forEach(b=>b.onclick=()=>{fixes[b.dataset.fix]={s:"fix",n:(fixes[b.dataset.fix]||{}).n||""};saveFix();renderList();const t=document.querySelector(`[data-note="${CSS.escape(b.dataset.fix)}"]`);if(t)t.focus()});
  $("list").querySelectorAll("[data-note]").forEach(t=>t.oninput=()=>{fixes[t.dataset.note].n=t.value;saveFix()});
  countFix()}
function saveFix(){store.set("vb-fix-"+lang,fixes);countFix()}
function countFix(){const v=Object.values(fixes);$("fixcount").textContent=`${v.filter(f=>f.s==="ok").length} bons · ${v.filter(f=>f.s==="fix").length} para corrigir`}
$("btn-copy").onclick=()=>{
  const fx=CARDS.filter(c=>(fixes[c.id]||{}).s==="fix");
  const txt=`Correções ${LANGS[lang].name} (${fx.length}):\n`+fx.map(c=>`- ${full(c)}: ${(fixes[c.id].n||"gancho ruim").trim()}`).join("\n");
  const done=()=>{$("copied").hidden=false;setTimeout(()=>$("copied").hidden=true,3000)};
  const fb=()=>{const t=$("copy-fallback");t.hidden=false;t.value=txt;t.select()};
  try{navigator.clipboard.writeText(txt).then(done,fb)}catch(e){fb()}};

/* ===== método ===== */
function renderMethod(){
  const common=`<section><h2>Como estudar (15 minutos por dia)</h2><ol>
    <li><b>Leia o português e diga a palavra em voz alta antes de virar.</b> Lembrar com esforço é o que fixa.</li>
    <li><b>Ouça e repita a frase inteira.</b> A frase curta fica; a palavra solta some.</li>
    <li><b>Seja honesto na nota.</b> Errei volta na hora, Difícil volta amanhã, Sabia volta em 1, 3, 7, 16 e 35 dias.</li>
    <li><b>Meta diária: ${GOAL} cartas.</b> Bater a meta mantém a sequência de dias. Novas: 10 por dia por padrão, libere mais quando quiser.</li>
    <li><b>Substantivo sempre com artigo e cor.</b></li></ol></section>`;
  const de=`<section><h2>Atalho: o alemão é primo do inglês</h2><p>Cinco trocas de som explicam centenas de palavras:</p><div class="tbl"><table><thead><tr><th>Inglês</th><th>Alemão</th><th>Exemplos</th></tr></thead><tbody>
    <tr><td class="mono">th</td><td class="mono">d</td><td>that → dass, then → dann, through → durch, thing → Ding</td></tr>
    <tr><td class="mono">t</td><td class="mono">z / ss</td><td>two → zwei, time → Zeit, water → Wasser, what → was</td></tr>
    <tr><td class="mono">d</td><td class="mono">t</td><td>day → Tag, good → gut, under → unter, word → Wort</td></tr>
    <tr><td class="mono">v / f</td><td class="mono">b</td><td>have → haben, give → geben, live → leben</td></tr>
    <tr><td class="mono">p</td><td class="mono">f / pf</td><td>ship → Schiff, apple → Apfel, open → offen</td></tr>
    <tr><td class="mono">k</td><td class="mono">ch</td><td>make → machen, book → Buch, week → Woche</td></tr></tbody></table></div></section>
    <section><h2>Gênero</h2><div class="gbox"><div style="background:var(--m-bg)"><b class="g-m">der</b>masculino, azul</div><div style="background:var(--f-bg)"><b class="g-f">die</b>feminino e plural, vermelho</div><div style="background:var(--n-bg)"><b class="g-n">das</b>neutro, verde</div></div>
    <p>Verbo virado substantivo é <b class="g-n">das</b> (das Leben). Final -ung, -heit, -keit, -schaft, -ion é <b class="g-f">die</b>. Final -chen e -lein é <b class="g-n">das</b>. Dias, meses e estações são <b class="g-m">der</b>.</p></section>`;
  const it=`<section><h2>Atalho: italiano é quase português</h2><ul>
    <li><b>Mais de 70% das palavras têm parente direto</b> em português ou espanhol. O gancho mostra o parente e a troca de som.</li>
    <li><b>-ção vira -zione:</b> nação → nazione, informação → informazione.</li>
    <li><b>-dade vira -tà:</b> cidade → città, verdade → verità, liberdade → libertà.</li>
    <li><b>pl/cl/fl viram pi/chi/fi:</b> pleno → pieno, chave → chiave, flor → fiore, praça → piazza.</li>
    <li><b>Consoante dobrada se pronuncia mais longa:</b> fato → fatto, ano → anno (e anno é diferente de ano!).</li></ul></section>
    <section><h2>Gênero</h2><div class="gbox"><div style="background:var(--m-bg)"><b class="g-m">il / lo / l'</b>masculino, azul</div><div style="background:var(--f-bg)"><b class="g-f">la / l'</b>feminino, vermelho</div></div>
    <p>Final -o quase sempre é masculino, -a quase sempre feminino. Final -e pode ser os dois: decore pela cor. "Lo" vem antes de s+consoante e z (lo studente, lo zio).</p></section>`;
  const fr=`<section><h2>Atalho: francês escreve como latim e fala encurtado</h2><ul>
    <li><b>A escrita entrega o parente:</b> table, porte, temps (tempo), mer (mar). A dificuldade é a pronúncia, por isso ouça sempre.</li>
    <li><b>Letras finais quase nunca soam:</b> petit = "ptí", vous = "vu", grand = "grã".</li>
    <li><b>Acento circunflexo marca um S que caiu:</b> forêt → floresta, hôpital → hospital, fête → festa.</li>
    <li><b>-ção vira -tion, -dade vira -té:</b> nation, liberté, vérité.</li>
    <li><b>Falsos amigos são poucos, mas perigosos:</b> eles vêm marcados como "Falso amigo".</li></ul></section>
    <section><h2>Gênero</h2><div class="gbox"><div style="background:var(--m-bg)"><b class="g-m">le / l'</b>masculino, azul</div><div style="background:var(--f-bg)"><b class="g-f">la / l'</b>feminino, vermelho</div></div>
    <p>Diante de vogal ou h mudo o artigo vira l', e aí só a cor mostra o gênero. Final -tion, -té, -ure costuma ser feminino; -ment, -age costuma ser masculino. Atenção: la mer, le lait, la fleur são diferentes do português.</p></section>`;
  $("method").innerHTML=common+({de,it,fr})[lang];
}

/* ===== eventos ===== */
function tab(name){["train","list","method"].forEach(n=>{$("tab-"+n).setAttribute("aria-selected",n===name);$("view-"+n).hidden=n!==name});if(name==="list")renderList();if(name==="train")renderTrain()}
$("tab-train").onclick=()=>tab("train");$("tab-list").onclick=()=>tab("list");$("tab-method").onclick=()=>tab("method");
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{if(b.dataset.lang!==lang)setLang(b.dataset.lang)});
$("sel-level").onchange=e=>{level=e.target.value;cur=null;free=false;buildQueue();renderTrain()};
$("sel-level-list").onchange=e=>{listLevel=e.target.value;$("search").value="";renderList()};
$("search").oninput=()=>renderList();
$("dir-pt").onclick=()=>{dir="pt";$("dir-pt").setAttribute("aria-pressed",true);$("dir-tg").setAttribute("aria-pressed",false);renderTrain()};
$("dir-tg").onclick=()=>{dir="tg";$("dir-tg").setAttribute("aria-pressed",true);$("dir-pt").setAttribute("aria-pressed",false);renderTrain()};
document.addEventListener("visibilitychange",()=>{if(!document.hidden){renderStreak();if(!cur){buildQueue();renderTrain()}}});
renderStreak();setLang(LANGS[lang]?lang:"de");
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
